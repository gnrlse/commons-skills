name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Skill isolation
        run: python3 tools/check_skill_isolation.py
      - name: Packaging (static install-route and shared-file checks)
        run: python3 tools/check_packaging.py
      - name: Checker accepts valid entries
        run: |
          for f in tools/fixtures/*-valid.json; do
            python3 plugins/commons/skills/commons/scripts/check_submission.py --offline "$f"
          done
      - name: Checker rejects every unedited template
        run: |
          for f in plugins/*/skills/*/assets/*.json; do
            case "$f" in *submission.schema.json|*semantic-query.json) continue ;; esac
            if python3 plugins/commons/skills/commons/scripts/check_submission.py --offline "$f" >/dev/null; then
              echo "::error::$f passed but should fail"; exit 1
            fi
          done
      - name: version.py matches git's tree hash for every skill
        run: |
          for skill in plugins/*/skills/*/; do
            skill=${skill%/}
            want=$(git rev-parse "HEAD:$skill")
            got=$(python3 "$skill/scripts/version.py" --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["git_tree"])')
            [ "$want" = "$got" ] || { echo "::error::$skill: version.py says $got, git says $want"; exit 1; }
          done
      - name: Zips build
        run: python3 tools/build_zip.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Claude Code marketplace validates
        run: npx -y @anthropic-ai/claude-code plugin validate .
